name: Deploy Cloud Run Job

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "requirements.txt"
      - ".gcloudignore"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: yt-media-cloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != '' && vars.GCP_STATE_BUCKET != '' && vars.GCP_RUNTIME_SA != '' && vars.GCP_DEPLOY_SA != '' && vars.GCP_WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy Cloud Run Job
        shell: bash
        run: |
          gcloud run jobs deploy yt-media-autopublisher \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --cpu 2 \
            --memory 8Gi \
            --task-timeout 3h \
            --max-retries 0 \
            --tasks 1 \
            --set-env-vars "YT_MEDIA_RUNTIME_DIR=/tmp/YT_MEDIA,YT_MEDIA_STATE_GCS_URI=gs://${{ vars.GCP_STATE_BUCKET }}/state.json,YT_MEDIA_CLIENT_SECRET_PATH=/secrets/client_secret.json,YT_MEDIA_DRIVE_TOKEN_PATH=/secrets/drive_token.json,YT_MEDIA_YOUTUBE_TOKEN_PATH=/secrets/youtube_token.json" \
            --set-secrets "/secrets/client_secret.json=yt-media-client-secret:latest,/secrets/drive_token.json=yt-media-drive-token:latest,/secrets/youtube_token.json=yt-media-youtube-token:latest" \
            --quiet

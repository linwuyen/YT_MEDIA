name: Publish Drive videos

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub schedule congestion.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yt-media-autopublisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore OAuth files from GitHub Secrets
        shell: bash
        env:
          CLIENT_SECRET_JSON: ${{ secrets.YT_MEDIA_CLIENT_SECRET_JSON }}
          DRIVE_TOKEN_JSON: ${{ secrets.YT_MEDIA_DRIVE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YT_MEDIA_YOUTUBE_TOKEN_JSON }}
          YOUTUBE_MANAGE_TOKEN_JSON: ${{ secrets.YT_MEDIA_YOUTUBE_MANAGE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          for name in CLIENT_SECRET_JSON DRIVE_TOKEN_JSON YOUTUBE_TOKEN_JSON; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub secret $name is missing. Run SETUP_GITHUB_ACTIONS.cmd once from the authorized Windows PC."
              exit 1
            fi
          done
          runtime="$RUNNER_TEMP/YT_MEDIA"
          mkdir -p "$runtime"
          printf '%s' "$CLIENT_SECRET_JSON" > "$runtime/client_secret.json"
          printf '%s' "$DRIVE_TOKEN_JSON" > "$runtime/drive_token.json"
          printf '%s' "$YOUTUBE_TOKEN_JSON" > "$runtime/youtube_token.json"
          if [ -n "${YOUTUBE_MANAGE_TOKEN_JSON:-}" ]; then
            printf '%s' "$YOUTUBE_MANAGE_TOKEN_JSON" > "$runtime/youtube_manage_token.json"
          fi

          python - <<'PY'
          from pathlib import Path

          runtime = Path("${{ runner.temp }}") / "YT_MEDIA"
          for name in ("client_secret.json", "drive_token.json", "youtube_token.json", "youtube_manage_token.json"):
              path = runtime / name
              if not path.exists():
                  continue
              data = path.read_bytes()
              if data.startswith(b"\xef\xbb\xbf"):
                  path.write_bytes(data[3:])
          PY

          chmod 600 "$runtime"/*.json
          echo "YT_MEDIA_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "YT_MEDIA_CLIENT_SECRET_PATH=$runtime/client_secret.json" >> "$GITHUB_ENV"
          echo "YT_MEDIA_DRIVE_TOKEN_PATH=$runtime/drive_token.json" >> "$GITHUB_ENV"
          echo "YT_MEDIA_YOUTUBE_TOKEN_PATH=$runtime/youtube_token.json" >> "$GITHUB_ENV"
          if [ -f "$runtime/youtube_manage_token.json" ]; then
            echo "YT_MEDIA_YOUTUBE_MANAGE_TOKEN_PATH=$runtime/youtube_manage_token.json" >> "$GITHUB_ENV"
          fi
          echo "YT_MEDIA_STATE_BACKEND=drive" >> "$GITHUB_ENV"

      - name: Ensure FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Install agent
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify Drive and YouTube identity
        run: python -m yt_media.agent doctor

      - name: Collect analytics and update strategy
        shell: bash
        run: |
          python -m yt_media.analytics_optimizer collect || \
            echo "::warning::Analytics optimizer failed; continuing with the last known strategy."

      - name: Refresh unpublished metadata
        shell: bash
        run: |
          python -m yt_media.metadata_optimizer refresh || \
            echo "::warning::Metadata refresh failed; continuing with normal publishing."

      - name: Publish next batch
        run: python -m yt_media.agent run

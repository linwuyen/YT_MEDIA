[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-media-agent"
version = "2.0.0"
description = "Google Drive to YouTube auto-publishing agent for local or Cloud Run execution"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.170,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "google-cloud-storage>=3.3,<4",
  "tzdata>=2025.2",
]

[project.scripts]
yt-media = "yt_media.agent:main"

[tool.setuptools.packages.find]
where = ["src"]
